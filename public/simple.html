<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사주 매칭 (간단 버전)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f8f9fa;
            color: #333;
        }
        @media (max-width: 768px) {
            .form-row { flex-direction: column; gap: 0; }
            .card { padding: 20px; }
            h1 { font-size: 2em; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔮 사주 궁합 매칭</h1>
        <p class="subtitle">생년월일시를 입력하여 운명의 상대를 만나보세요</p>
        
        <form action="/api/register" method="post">
            <div class="form-group">
                <label for="birth-year">생년 (양력)</label>
                <select id="birth-year" name="birthYear" required>
                    <option value="">년도 선택</option>
                </select>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="birth-month">월</label>
                    <select id="birth-month" name="birthMonth" required>
                        <option value="">월</option>
                        <option value="1">1월</option>
                        <option value="2">2월</option>
                        <option value="3">3월</option>
                        <option value="4">4월</option>
                        <option value="5">5월</option>
                        <option value="6">6월</option>
                        <option value="7">7월</option>
                        <option value="8">8월</option>
                        <option value="9">9월</option>
                        <option value="10">10월</option>
                        <option value="11">11월</option>
                        <option value="12">12월</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="birth-day">일</label>
                    <select id="birth-day" name="birthDay" required>
                        <option value="">일</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="birth-hour">시</label>
                    <select id="birth-hour" name="birthHour" required>
                        <option value="">시간</option>
                        <option value="0">자시 (23-01시)</option>
                        <option value="1">축시 (01-03시)</option>
                        <option value="2">인시 (03-05시)</option>
                        <option value="3">묘시 (05-07시)</option>
                        <option value="4">진시 (07-09시)</option>
                        <option value="5">사시 (09-11시)</option>
                        <option value="6">오시 (11-13시)</option>
                        <option value="7">미시 (13-15시)</option>
                        <option value="8">신시 (15-17시)</option>
                        <option value="9">유시 (17-19시)</option>
                        <option value="10">술시 (19-21시)</option>
                        <option value="11">해시 (21-23시)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="gender">성별</label>
                    <select id="gender" name="gender" required>
                        <option value="">성별</option>
                        <option value="male">남성</option>
                        <option value="female">여성</option>
                    </select>
                </div>
            </div>
            
            <button type="submit" class="btn-primary">🌟 운명의 상대 찾기</button>
        </form>
        
        <div class="status">
            💡 <strong>서비스 상태:</strong> 서버 연결됨<br>
            🔗 <strong>고급 버전:</strong> <a href="/">메인 서비스</a> | 
            🧪 <strong>테스트:</strong> <a href="/test.html">연결 테스트</a>
        </div>
    </div>

    <script>
        // 년도 옵션 추가 (간단한 JavaScript)
        const yearSelect = document.getElementById('birth-year');
        const currentYear = new Date().getFullYear();
        for (let year = currentYear - 80; year <= currentYear - 18; year++) {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = year + '년';
            yearSelect.appendChild(option);
        }
        
        // 일 옵션 추가
        const monthSelect = document.getElementById('birth-month');
        const daySelect = document.getElementById('birth-day');
        
        monthSelect.addEventListener('change', function() {
            const month = parseInt(this.value);
            daySelect.innerHTML = '<option value="">일</option>';
            
            if (month) {
                const daysInMonth = new Date(2023, month, 0).getDate();
                for (let day = 1; day <= daysInMonth; day++) {
                    const option = document.createElement('option');
                    option.value = day;
                    option.textContent = day + '일';
                    daySelect.appendChild(option);
                }
            }
        });
    </script>
</body>
</html>
